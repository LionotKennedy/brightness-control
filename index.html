<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle de Luminosité</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --text-color: #ffffff;
            --bg-color: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            --card-bg: rgba(255, 255, 255, 0.1);
            --hover-bg: rgba(255, 255, 255, 0.2);
            --active-bg: rgba(255, 255, 255, 0.3);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --border-radius: 16px;
        }
        
        body {
            background: var(--bg-color);
            color: var(--text-color);
            user-select: none;
            -webkit-app-region: drag;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .app-container {
            width: 90vw;
            max-width: 500px;
            min-width: 300px;
            height: 90vh;
            max-height: 600px;
            min-height: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex;
            flex-direction: column;
            padding: min(4vw, 24px);
            margin: auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: min(4vw, 24px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }
        
        .title {
            font-size: clamp(18px, 4vw, 24px);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .controls {
            -webkit-app-region: no-drag;
            display: flex;
            gap: min(2vw, 12px);
        }
        
        .btn {
            background: var(--hover-bg);
            border: none;
            width: clamp(28px, 8vw, 36px);
            height: clamp(28px, 8vw, 36px);
            border-radius: 50%;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(16px, 4vw, 20px);
            transition: all 0.2s ease;
        }
        
        .btn:hover {
            background: var(--active-bg);
            transform: scale(1.05);
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: min(5vw, 30px) 0;
        }
        
        .brightness-section {
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .brightness-value {
            font-size: clamp(40px, 12vw, 72px);
            font-weight: 700;
            margin-bottom: min(2vw, 12px);
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }
        
        .brightness-label {
            font-size: clamp(14px, 3vw, 18px);
            opacity: 0.8;
            margin-bottom: min(5vw, 30px);
        }
        
        .slider-container {
            width: 100%;
            padding: 0 min(3vw, 20px);
            margin: min(4vw, 24px) 0;
            -webkit-app-region: no-drag;
        }
        
        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 40px;
            display: flex;
            align-items: center;
        }
        
        input[type="range"] {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: linear-gradient(to right, 
                rgba(255, 255, 255, 0.2), 
                rgba(255, 255, 255, 0.8));
            border-radius: 10px;
            outline: none;
            cursor: pointer;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: clamp(24px, 8vw, 32px);
            height: clamp(24px, 8vw, 32px);
            background: white;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 3px solid var(--primary-color);
            transition: all 0.2s ease;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
        }
        
        .slider-ticks {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 8px;
            padding: 0 10px;
        }
        
        .tick {
            font-size: clamp(10px, 2vw, 12px);
            opacity: 0.6;
        }
        
        .quick-controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: min(2vw, 12px);
            margin: min(4vw, 24px) 0;
            -webkit-app-region: no-drag;
        }
        
        .quick-btn {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: min(3vw, 16px);
            border-radius: 12px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: clamp(14px, 3vw, 18px);
            font-weight: 500;
        }
        
        .quick-btn:hover {
            background: var(--hover-bg);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .quick-btn.active {
            background: white;
            color: var(--primary-color);
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.3);
        }
        
        .adjust-section {
            display: flex;
            justify-content: center;
            gap: min(5vw, 30px);
            margin-top: auto;
            -webkit-app-region: no-drag;
        }
        
        .adjust-btn {
            background: var(--card-bg);
            border: none;
            width: clamp(48px, 15vw, 64px);
            height: clamp(48px, 15vw, 64px);
            border-radius: 50%;
            color: var(--text-color);
            font-size: clamp(24px, 8vw, 32px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .adjust-btn:hover {
            background: var(--hover-bg);
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .footer {
            text-align: center;
            font-size: clamp(10px, 2vw, 12px);
            opacity: 0.6;
            padding-top: min(3vw, 20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Responsive Design */
        @media (max-width: 400px) {
            .app-container {
                width: 95vw;
                height: 95vh;
                padding: 16px;
            }
            
            .quick-controls {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .adjust-section {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
        }
        
        @media (max-height: 450px) {
            .app-container {
                height: auto;
                min-height: 95vh;
            }
            
            .main-content {
                padding: 15px 0;
            }
            
            .brightness-section {
                padding: 10px 0;
            }
        }
        
        /* Animation pour les mises à jour de luminosité */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .brightness-value.updated {
            animation: pulse 0.5s ease;
        }
        
        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            :root {
                --card-bg: rgba(0, 0, 0, 0.2);
                --hover-bg: rgba(0, 0, 0, 0.3);
            }
        }
        
        /* Support pour les écrans tactiles */
        @media (hover: none) and (pointer: coarse) {
            .btn, .quick-btn, .adjust-btn {
                min-height: 44px; /* Taille minimale pour le touch */
            }
            
            input[type="range"]::-webkit-slider-thumb {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="title">
                <span class="icon">🌤️</span>
                <span class="text">Luminosité</span>
            </div>
            <div class="controls">
                <button class="btn" id="minimize-btn" title="Réduire">−</button>
                <button class="btn" id="close-btn" title="Fermer">×</button>
            </div>
        </div>
        
        <div class="main-content">
            <div class="brightness-section">
                <div class="brightness-value" id="brightness-value">50%</div>
                <div class="brightness-label">Luminosité actuelle</div>
                
                <div class="slider-container">
                    <div class="slider-wrapper">
                        <input type="range" min="0" max="100" value="50" class="slider" id="brightness-slider">
                    </div>
                    <div class="slider-ticks">
                        <span class="tick">0%</span>
                        <span class="tick">25%</span>
                        <span class="tick">50%</span>
                        <span class="tick">75%</span>
                        <span class="tick">100%</span>
                    </div>
                </div>
                
                <div class="quick-controls" id="quick-controls">
                    <button class="quick-btn" data-value="0">🌑 0%</button>
                    <button class="quick-btn" data-value="25">🌘 25%</button>
                    <button class="quick-btn" data-value="50">🌗 50%</button>
                    <button class="quick-btn" data-value="75">🌖 75%</button>
                    <button class="quick-btn" data-value="100">🌕 100%</button>
                </div>
            </div>
            
            <div class="adjust-section">
                <button class="adjust-btn" id="decrease-btn" title="Diminuer">
                    <span class="icon">−</span>
                </button>
                <button class="adjust-btn" id="increase-btn" title="Augmenter">
                    <span class="icon">+</span>
                </button>
            </div>
        </div>
        
        <div class="footer">
            <div class="status" id="connection-status">● Connecté</div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
